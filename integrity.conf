
#========================
# Common settings
#========================

# You will probably want to change most of these.

reportName="default_adhoc_report"
host="duck-puppy"
path="/storage1"
reportDir="../integrity_reports"
dataSource="file"

# number of concurrent processes reading files and calculating checksums

paraCount="8"

#========================
# Special settings
#========================
removeBasePath="false"

# Agent server settings (used when running 'agent' command)
agentHost="localhost"
agentPort="8080"

# Remote hosts config (used by hosts, pingall, sync, remoteall, start)
hostsConfig="hosts.conf"

#========================
# Security
#========================
# The agent always uses TLS 1.3 and requires a login.
#
# agentCert/agentKey - the agent's certificate; generated on first start.
# knownAgents        - client side: pinned fingerprints of agents, like SSH's
#                      known_hosts.  Filled automatically on first connection
#                      (trustNewAgents="true") or by scripts/deploy.sh.
#                      Set trustNewAgents="false" to refuse unknown agents.
# usersDB            - the agent's user file.  A fresh agent creates the
#                      default user admin / changeme.  CHANGE IT:
#                        ship-grip-fim user passwd admin <new-password>
# agentUser/agentPassword - credentials this machine uses to reach agents
#                      (overridable per host in hosts.conf, or with the
#                      SGF_AGENT_PASSWORD environment variable).
agentCert="agent.crt"
agentKey="agent.key"
knownAgents="known_agents"
trustNewAgents="true"
usersDB="users.db"
agentUser="admin"
agentPassword="changeme"

# The web GUI requires a login (same users file, same roles) and is served
# over HTTPS with the agent certificate.  Set webHost="0.0.0.0" to run one
# central web GUI that people use from their browsers instead of installing
# the desktop GUI.  webTLS="false" is only sensible on localhost.
webTLS="true"

# Agent schedule config (loaded when agent starts, persisted on add/remove)
scheduleConfig="schedule.conf"

# Prometheus exporter settings (used when running 'exporter' command)
# Scrapes all agents listed in hostsConfig and exposes fim_* metrics.
exporterHost="0.0.0.0"
exporterPort="9110"

# Web GUI settings (used when running 'webgui' command)
# Browser-based interface — same features as the desktop GUI.
webHost="localhost"
webPort="8090"



# exclude files that match these regexes from report
# not considered while scanning ( for perf ), just excluded from report
# NOTE - scan can be run from ANY OS against files from ANY OTHER OS
ignorePathConfig="integrity_ignore.cfg"

# Don't walk these dirs at all.  They are either useless or cause errors.
# NOTE - scan can be run from ANY OS against files from ANY OTHER OS
ignorePathNoWalkConfig="integrity_ignore_no_walk.cfg"


#========================
# Database settings
#========================

# Change the host if mongodb is running somewhere else.
# This should include the host and port as one string if it is remote.

databaseHost="localhost"


# These shouldn't need to be changed ever but they are here just in case. 
# You might change these if you are sharing a db with something else for some
# reason and you don't want a name collision.

database="integrity"
reportCollection="report"
fileHashCollection="fileHash"

 

